<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modern Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      transition: background 0.5s ease;
    }

    .calculator {
      width: 100%;
      max-width: 360px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .display {
      padding: 2rem;
      text-align: right;
      font-size: 2.5rem;
      font-weight: 300;
      color: #fff;
      background: rgba(0, 0, 0, 0.1);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .operation {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 0.25rem;
    }

    .button {
      border: none;
      border-radius: 16px;
      font-size: 1.5rem;
      font-weight: 600;
      padding: 1.2rem 0;
      margin: 0.25rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
    }

    .button:active {
      transform: translateY(1px);
      opacity: 0.8;
    }

    .btn-number { background: rgba(255, 255, 255, 0.2); color: #fff; }
    .btn-operation { background: #667eea; color: #fff; }
    .btn-equals { background: #764ba2; color: #fff; }
    .btn-clear { background: #f87171; color: #fff; }

    .theme-toggle {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      backdrop-filter: blur(4px);
      color: #fff;
      z-index: 10;
    }

    .dark-mode {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    }

    .dark-mode .calculator {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .dark-mode .display {
      background: rgba(0, 0, 0, 0.2);
    }

    .dark-mode .button {
      color: #fff;
    }

    .dark-mode .btn-number { background: rgba(255, 255, 255, 0.1); }
    .dark-mode .btn-operation { background: #4f46e5; }
    .dark-mode .btn-equals { background: #6d28d9; }
    .dark-mode .btn-clear { background: #dc2626; }

    .dark-mode .theme-toggle {
      background: rgba(0, 0, 0, 0.3);
      border-color: rgba(255, 255, 255, 0.2);
      color: #fff;
    }
  </style>
</head>
<body class="dark-mode">

  <div class="calculator">
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
    <div class="display">
      <div class="operation" id="operation"></div>
      <div id="display">0</div>
    </div>

    <div class="grid grid-cols-4 gap-3 p-4">
      <!-- Row 1 -->
      <button class="button btn-clear" onclick="clearAll()">AC</button>
      <button class="button btn-number" onclick="appendNumber('±')">±</button>
      <button class="button btn-number" onclick="appendNumber('%')">%</button>
      <button class="button btn-operation" onclick="setOperation('÷')">÷</button>

      <!-- Row 2 -->
      <button class="button btn-number" onclick="appendNumber('7')">7</button>
      <button class="button btn-number" onclick="appendNumber('8')">8</button>
      <button class="button btn-number" onclick="appendNumber('9')">9</button>
      <button class="button btn-operation" onclick="setOperation('×')">×</button>

      <!-- Row 3 -->
      <button class="button btn-number" onclick="appendNumber('4')">4</button>
      <button class="button btn-number" onclick="appendNumber('5')">5</button>
      <button class="button btn-number" onclick="appendNumber('6')">6</button>
      <button class="button btn-operation" onclick="setOperation('-')">−</button>

      <!-- Row 4 -->
      <button class="button btn-number" onclick="appendNumber('1')">1</button>
      <button class="button btn-number" onclick="appendNumber('2')">2</button>
      <button class="button btn-number" onclick="appendNumber('3')">3</button>
      <button class="button btn-operation" onclick="setOperation('+')">+</button>

      <!-- Row 5 -->
      <button class="button btn-number" onclick="appendNumber('0')" style="grid-column: span 2;">0</button>
      <button class="button btn-number" onclick="appendDecimal()">.</button>
      <button class="button btn-equals" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let displayValue = '0';
    let prevValue = null;
    let operation = null;
    let waitingForOperand = false;

    const display = document.getElementById('display');
    const operationEl = document.getElementById('operation');

    function updateDisplay() {
      display.textContent = displayValue;
      operationEl.textContent = operation ? `${prevValue} ${operation}` : '';
    }

    function appendNumber(num) {
      if (waitingForOperand) {
        displayValue = num;
        waitingForOperand = false;
      } else {
        displayValue = displayValue === '0' ? num : displayValue + num;
      }
      updateDisplay();
    }

    function appendDecimal() {
      if (waitingForOperand) {
        displayValue = '0.';
        waitingForOperand = false;
      } else if (!displayValue.includes('.')) {
        displayValue += '.';
      }
      updateDisplay();
    }

    function setOperation(op) {
      const inputValue = parseFloat(displayValue);

      if (prevValue === null) {
        prevValue = inputValue;
      } else if (operation) {
        const newValue = calculate(prevValue, inputValue, operation);
        displayValue = String(newValue);
        prevValue = newValue;
      }

      operation = op;
      waitingForOperand = true;
      updateDisplay();
    }

    function calculate(a, b, op) {
      switch (op) {
        case '+': return a + b;
        case '-': return a - b;
        case '×': return a * b;
        case '÷': return b !== 0 ? a / b : 0;
        default: return b;
      }
    }

    function calculateResult() {
      if (prevValue === null || operation === null) return;

      const inputValue = parseFloat(displayValue);
      const newValue = calculate(prevValue, inputValue, operation);

      displayValue = String(newValue);
      prevValue = null;
      operation = null;
      waitingForOperand = true;
      updateDisplay();
    }

    function clearAll() {
      displayValue = '0';
      prevValue = null;
      operation = null;
      waitingForOperand = false;
      updateDisplay();
    }

    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
      const toggle = document.querySelector('.theme-toggle');
      toggle.textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
    }

    // Keyboard support
    document.addEventListener('keydown', (e) => {
      const key = e.key;
      if (/[0-9]/.test(key)) appendNumber(key);
      if (key === '.') appendDecimal();
      if (key === '+') setOperation('+');
      if (key === '-') setOperation('-');
      if (key === '*') setOperation('×');
      if (key === '/') {
        e.preventDefault();
        setOperation('÷');
      }
      if (key === 'Enter' || key === '=') calculateResult();
      if (key === 'Escape') clearAll();
    });

    // Initialize
    updateDisplay();
  </script>

</body>
</html>
